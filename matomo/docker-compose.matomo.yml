services:
  matomo:
    image: matomo:5.7.1
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - |
        chown 33:33 /var/www/html/config/config.ini.php 2>/dev/null || true
        chmod 664 /var/www/html/config/config.ini.php 2>/dev/null || true
        exec apache2-foreground
    ports:
      - "8080:80"
    environment:
      - MATOMO_DATABASE_HOST=db
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_TABLES_PREFIX=matomo_
      - MATOMO_DATABASE_USERNAME=${MATOMO_USER}
      - MATOMO_DATABASE_PASSWORD=${MATOMO_PASSWORD}
      - MATOMO_DATABASE_DBNAME=matomo
    volumes:
      - matomo_data:/var/www/html
      - ./matomo.config.ini:/var/www/html/config/config.ini.php
      - /var/lib/GeoIP:/var/lib/GeoIP:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=${MATOMO_USER}
      - MYSQL_PASSWORD=${MATOMO_PASSWORD}
    volumes:
      - matomo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matomo_data:
  matomo_mysql:
